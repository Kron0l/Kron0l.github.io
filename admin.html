<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Content Editor</title>
<link rel="stylesheet" href="./css/admin.css">
</head>
<body>
<div id="admin-login" class="login-overlay">
  <form id="admin-login-form" class="login-card">
    <p class="eyebrow">PRIVATE AREA</p>
    <h1>Administration</h1>
    <p>Entre le mot de passe pour ouvrir l’éditeur du portfolio.</p>
    <label for="admin-password">Mot de passe</label>
    <input id="admin-password" type="password" autocomplete="current-password" required>
    <button class="login-button" type="submit">Se connecter</button>
    <p id="admin-login-error" class="login-error" aria-live="polite"></p>
  </form>
</div>
<div id="admin-protected" class="admin-protected hidden">
<header class="admin-header"><div><p class="eyebrow">LOCAL CONTENT EDITOR</p><h1>Portfolio Admin</h1></div><a href="./index.html">Voir le site ↗</a></header>
<main class="admin-layout">
<aside>
  <button data-tab="general" class="active">Général</button>
  <button data-tab="hero">Intro</button>
  <button data-tab="about">À propos</button>
  <button data-tab="skills">Compétences</button>
  <button data-tab="projects">Projets</button>
  <button data-tab="contact">Contact</button>
</aside>
<section class="editor">
  <div class="toolbar">
    <label>Langue <select id="edit-language"><option value="fr">Français</option><option value="en">English</option></select></label>
    <button id="import-button">Importer JSON</button>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <button id="reset-button">Recharger</button>
    <button id="export-button" class="primary">Exporter content.json</button>
  </div>
  <div id="editor-content"></div>
</section>
</main>
</div>
<script src="./js/admin-auth.js"></script>
<script src="./js/admin.js"></script>
</body></html>
